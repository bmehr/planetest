<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aircraft AR Viewer</title>

  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #121212;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      display: block;
    }
    .ar-button {
      background-color: #0071e3;
      border-radius: 28px;
      border: none;
      color: white;
      font-size: 16px;
      font-weight: 600;
      padding: 14px 28px;
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      z-index: 999;
    }
  </style>
</head>
<body>

  <!--
    Key changes:
    - bounds="tight": Calculates real physical bounds so the floor sits flush with the bottom.
    - scale="2 2 2": Scales up the plane from 28cm to ~56cm so it is clearly visible.
    - ar-modes="webxr scene-viewer quick-look": Ensures native fallback.
    - ar-scale="auto": Allows you to pinch to scale it in AR if it's too big/small.
  -->
  <model-viewer
    id="viewer"
    src="aircraft_chrome.glb"
    alt="Chrome Aircraft"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-placement="floor"
    ar-scale="auto"
    bounds="tight"
    scale="2 2 2"
    camera-controls
    auto-rotate
    shadow-intensity="1.5"
    shadow-softness="0.5"
    exposure="1.2">

    <button slot="ar-button" class="ar-button">
      View in your space
    </button>

  </model-viewer>

</body>
</html>
